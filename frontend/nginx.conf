server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Vite puts a content hash in every asset file name, so these can be cached for a year.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Single-page app: any other path (e.g. /leads/123) gets index.html and React Router shows the page.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
